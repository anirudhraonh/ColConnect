<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <script>
    function confirmDelete() {
      return confirm("Are you sure you want to delete this post? It cannot be recovered once deleted!");
    }
  </script>

  <style>
    .post-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 2rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .post-title-section {
      flex: 1;
      min-width: 300px;
    }

    .post-title-section h2 {
      margin-top: 0;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid rgba(99, 102, 241, 0.3);
    }

    .post-meta {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2rem;
      padding: 1rem;
      background: rgba(99, 102, 241, 0.05);
      border-radius: 8px;
    }

    .delete-form {
      display: inline-block;
      background: none;
      border: none;
      padding: 0;
      box-shadow: none;
      max-width: none;
      margin: 0;
    }

    .delete-form button {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .delete-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(239, 68, 68, 0.4);
    }

    img {
      width: 100%;
      max-width: 800px;
      height: auto;
      display: block;
      margin: 2rem auto;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .post-content {
      font-size: 1rem;
      line-height: 1.8;
      margin: 2rem 0;
      padding: 1.5rem;
      background: rgba(30, 41, 59, 0.5);
      border-radius: 8px;
    }
  </style>

</head>
<body>
<!-- Include navbar fragment -->
<div th:replace="fragments :: navbar"></div>

<div class="post-container">
  <h1>Welcome to Post Page</h1>
  <hr>

  <!-- Display success or error messages -->
  <p style="color:red;" th:if="${error}" th:text="${error}"></p>
  <p style="color:green;" th:if="${success}" th:text="${success}"></p>

  <div class="post-header">
    <div class="post-title-section">
      <h2 th:text="${post != null ? post.title : 'Post Not Found'}"></h2>
    </div>
    <!-- Delete form only if current user is author -->
    <form th:if="${post != null and currentUser != null and currentUser.id == post.user.id}"
          th:action="@{/delete/{id}(id=${post.id})}"
          method="post"
          onsubmit="return confirmDelete();"
          class="delete-form">
      <input type="hidden" name="_method" value="DELETE"/>
      <button type="submit">Delete Post</button>
    </form>
  </div>

  <div th:if="${post != null}">
    <div class="post-meta">
      <p>
        <strong>Posted by:</strong>
        <a th:href="@{/profile/{id}(id=${post.user.id})}" th:text="${post.user.name}"></a>
      </p>

      <p>
        <strong>Posted on:</strong>
        <span th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy HH:mm')}"></span>
      </p>
    </div>

    <!-- Show post image -->
    <img th:if="${post.image_url != null}" th:src="@{${post.image_url}}" alt="Post image">

    <div class="post-content" th:text="${post.text}"></div>
  </div>

  <!-- Comment Form -->
  <div th:if="${post != null and currentUser != null}">
    <form th:action="@{/postComment/{id}(id=${post.id})}" method="post">
      <input type="text" name="comment" placeholder="Leave a comment">
      <input type="submit" value="Post">
    </form>
  </div>

  <!-- Comments Section -->
  <div th:if="${post != null and post.commentList != null and !post.commentList.isEmpty()}">
    <h3>Comments</h3>
    <ul>
      <li th:each="comment : ${post.commentList}">
        <a th:href="@{/profile/{id}(id=${comment.user.id})}"><strong th:text="${comment.user.name}"></strong></a>:
        <span th:text="${comment.comment}"></span>
        <small th:text="${#temporals.format(comment.commentTimestamp, 'dd MMM yyyy HH:mm')}"></small>
      </li>
    </ul>
  </div>
</div>

</body>
</html>
