<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${user.name} + ' Profile'">User Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <style>
    /* Profile-specific styles to work with main.css */
    .container {
      max-width: 900px;
      margin: 2rem auto;
      background: rgba(30, 41, 59, 0.8);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .profile-img {
      display: block;
      margin: 1.5rem auto 2rem;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(99, 102, 241, 0.5);
    }

    .info {
      max-width: 520px;
      margin: 0 auto;
    }

    .info p {
      font-size: 0.95rem;
      margin: 0.75rem 0;
      color: #cbd5e1;
    }

    .interests span {
      display: inline-block;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #e0e7ff;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      margin: 0.5rem 0.5rem 0 0;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .interests span:hover {
      background: rgba(99, 102, 241, 0.2);
      color: #ffffff;
    }

    .actions {
      text-align: center;
      margin-top: 2rem;
    }

    a.button {
      display: inline-block;
      margin: 0.75rem 0.5rem;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    a.button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    }

    .error-msg {
      text-align: center;
      color: #fca5a5;
      font-weight: 600;
      margin: 1rem 0;
    }

    .msg {
      text-align: center;
      color: #86efac;
      font-weight: 600;
      margin: 1rem 0;
    }

    @media (max-width: 600px) {
      .container {
        margin: 1rem;
        padding: 1.5rem;
      }
    }
  </style>

</head>
<body>
<!-- Include navbar fragment -->
<div th:replace="fragments :: navbar"></div>

<div class="container">

  <h1 th:text="${user.name} + '\'s Profile'"></h1>

  <div th:if="${error}" class="error-msg" th:text="${error}"></div>
  <div th:if="${msg}" class="msg" th:text="${msg}"></div>

  <img class="profile-img" th:src="@{${user.profilePicture_url}}" alt="Image not found">

  <div class="info">
    <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
    <p><strong>College:</strong> <span th:text="${user.college}"></span></p>
    <p><strong>Department:</strong> <span th:text="${user.dept}"></span></p>
    <p><strong>Interests:</strong>
      <span class="interests" th:each="interest : ${user.interests}" th:text=" ' ' +${interest}"></span>
    </p>
  </div>

  <h2>Posts (<span th:text="${user.posts.size()}"></span>)</h2>

  <div class="actions">
    <a th:href="@{/userposts/{user_id}(user_id=${user.id})}" class="button"
       th:text="'Show ' + ${user.name} + '\'s posts'"></a>

    <div th:if="${currentUser.id == user.id}">
      <a th:href="@{/updateProfile/{id}(id=${user.id})}" class="button">Update profile</a>
    </div>

    <div th:unless="${currentUser.id == user.id}">
      <a th:href="@{/chat}" class="button">message</a>
    </div>
  </div>

</div>

</body>
</html>
