<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">

    <script>

    </script>

    <style>
    <style>
        /* No page-specific overrides needed - main.css handles all styling */
    </style>
    </style>



</head>
<body>

<h1>Welcome to login page</h1>
<div class="success" th:text="${success}"></div>
<div class="error" th:text="${error}"></div>
<form th:action="@{/login}" method="post">
    Enter name:<input name="username" placeholder="Enter your full name" required><br>
    Enter password:<input name="password" placeholder="Enter password for your Colconnect account." required type="password"><br>

    <input type="submit" value="Log in">
</form>
<p>Don't have an account? <a th:href="@{/register}">Register here</a></p>
</body>
</html>
