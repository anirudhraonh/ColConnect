<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login page</title>

    <script>

    </script>

    <style>
        /* ========= Theme Base ========= */
        body {
            background: radial-gradient(circle at top, #065f46, #022c22 65%);
            color: #ecfdf5;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* ========= Page Content ========= */
        h1 {
            text-align: center;
            margin-top: 80px;
            margin-bottom: 1.5rem;
            color: #fbbf24;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        /* ========= Messages ========= */
        .success,
        .error {
            max-width: 420px;
            margin: 0 auto 1rem;
            text-align: center;
            font-size: 0.85rem;
        }

        .success {
            color: #6ee7b7;
        }

        .error {
            color: #fca5a5;
        }

        /* ========= Form ========= */
        form {
            max-width: 420px;
            margin: 0 auto;
            background: rgba(2, 44, 34, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 16px;
            padding: 2rem 2.2rem;
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        /* ========= Inputs ========= */
        input[name="username"],
        input[name="password"] {
            width: 90%;
            margin-bottom: 1rem;
            padding: 0.7rem 0.9rem;
            background: rgba(6, 78, 59, 0.75);
            border: 1px solid rgba(16, 185, 129, 0.5);
            border-radius: 10px;
            color: #ecfdf5;
            font-size: 0.85rem;
            transition: all 0.25s ease;
        }

        input::placeholder {
            color: #a7f3d0;
            opacity: 0.75;
        }

        input:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.2);
            background: rgba(6, 78, 59, 0.9);
        }

        /* ========= Submit Button ========= */
        input[type="submit"] {
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.75rem;
            border-radius: 999px;
            border: none;
            background: linear-gradient(to right, #fbbf24, #facc15);
            color: #022c22;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        input[type="submit"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.45);
        }

        /* ========= Footer ========= */
        p {
            max-width: 420px;
            margin: 1.2rem auto 0;
            text-align: center;
            font-size: 0.8rem;
            color: #d1fae5;
        }

        p a {
            color: #fbbf24;
            text-decoration: none;
            font-weight: 600;
        }

        p a:hover {
            color: #fde68a;
            text-decoration: underline;
        }
    </style>



</head>
<body>

<h1>Welcome to login page</h1>
<div class="success" th:text="${success}"></div>
<div class="error" th:text="${error}"></div>
<form th:action="@{/login}" method="post">
    Enter name:<input name="username" placeholder="Enter your full name" required><br>
    Enter password:<input name="password" placeholder="Enter password for your Colconnect account." required type="password"><br>

    <input type="submit" value="Log in">
</form>
<p>Don't have an account? <a th:href="@{/register}">Register here</a></p>
</body>
</html>
