<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Register Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">

    <script>
        function pwdMatch(){

            var pwd = document.querySelector('input[name="pwd"]').value;
            var confpwd = document.querySelector('input[name="confpwd"]').value;
            if (pwd != confpwd){
                alert("Passwords do not match");
                return false;
            }
            return true; //allow form submission
        }
    </script>


    <style>
        .error { color: #fca5a5; font-size: 0.85rem; margin-top: 0.5rem; }
        .form-group { margin-bottom: 1.5rem; }
    </style>
    </style>
</head>
<body>
    <h1>Welcome to registration page</h1>
    <div>Please register in order to proceed.</div>
    <br>
    <hr>
    <div class="error" th:text="${error}"></div>
    <form th:action="@{/register}" onsubmit="return pwdMatch()" method="post" th:object="${userFormDTO}">
        <div class="form-group">
            Enter name:<input th:field="*{username}" placeholder="Enter your full name" required><br>
            <p class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>
        <div class="form-group">
        Enter password:<input th:field="*{password}" placeholder="Enter password for your Colconnect account." required type="password"><br>
            <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>
        <div class="form-group">
        Re-enter Password:<input name="confpwd" placeholder="Re-enter password" type="password" required><br>
        </div>
        <div class="form-group">
        Enter email address:<input th:field="*{email}" placeholder="Enter your email id" type="email" required><br>
            <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <input type="submit" value="Register">
    </form>
</body>
</html>
