<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        /* All styling handled by main.css - no overrides needed */
    </style>
</head>
<body>
<!-- Include navbar fragment -->
<div th:replace="fragments :: navbar"></div>

<h2>Update Profile</h2>

<form th:action="@{/updateProfile/{id}(id=${currentUser.id})}"
      method="post"
      enctype="multipart/form-data">

    <label for="email">Email:</label>
    <input type="email" id="email" name="email"
           th:placeholder="${currentUser.email}">

    <label for="college">College:</label>
    <input type="text" id="college" name="college"
           th:placeholder="${currentUser.college}">

    <label for="dept">Department:</label>
    <input type="text" id="dept" name="dept"
           th:placeholder="${currentUser.dept}">

    <label for="interests">Interests (comma-separated):</label>
    <input type="text" id="interests" name="interests"
           th:placeholder="${currentUser.interests}">

    <label for="profilePicture">Profile Picture:</label>
    <input type="file" id="profilePicture" name="profilePicture" accept="image/*">

    <button type="submit">Save Changes</button>

</form>

</body>
</html>
